name: Yahoo Contract

on:
    pull_request:
        branches:
            - main
        types: [opened, synchronize, reopened, ready_for_review]
    schedule:
        - cron: '0 6 * * *' # daily at 06:00 UTC
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

jobs:
    yahoo-contract:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: ./.github/actions/setup
            - run: pnpm e2e:yahoo
