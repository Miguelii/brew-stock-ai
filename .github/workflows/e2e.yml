name: E2E Tests

on:
    pull_request:
    push:
        branches:
            - main

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    e2e:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.24.0

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run E2E tests
              run: pnpm e2e
