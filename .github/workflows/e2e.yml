name: Smoke Tests

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
        types: [opened, synchronize, reopened, ready_for_review]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    NEXT_SUPABASE_URL: http://localhost:54321
    NEXT_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    NEXT_SUPABASE_SERVICE_ROLE_KEY: test-service-key
    NEXT_FINNHUB_BASE_URL: http://localhost:54321/api/v1
    NEXT_FINNHUB_API_KEY: test-key
    NEXT_PUBLIC_VAPID_PUBLIC_KEY: BGiSpRcyyWiwlesjTWooXl
    NEXT_ANTHROPIC_AI_KEY: sk-test
    VAPID_PRIVATE_KEY: vapid-test

jobs:
    e2e:
        if: github.event.pull_request.draft == false
        runs-on: ubuntu-latest
        # Official Playwright image: Chromium + all system deps baked in, pinned to the
        # installed @playwright/test version. Keep this tag in sync with package.json.
        container:
            image: mcr.microsoft.com/playwright:v1.61.1-jammy
        steps:
            - uses: actions/checkout@v6
            - uses: ./.github/actions/setup
            - uses: actions/cache@v6
              with:
                  path: .next/cache
                  key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
                  restore-keys: |
                      ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
            - run: node --run build
            - run: pnpm e2e
