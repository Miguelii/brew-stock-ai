name: E2E Tests

on:
    pull_request:
    push:
        branches:
            - main

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    # Shared across build and test steps
    NEXT_SUPABASE_URL: http://localhost:54321
    NEXT_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    NEXT_SUPABASE_SERVICE_ROLE_KEY: test-service-key
    NEXT_FINNHUB_BASE_URL: http://localhost:54321/api/v1
    NEXT_FINNHUB_API_KEY: test-key
    NEXT_PUBLIC_VAPID_PUBLIC_KEY: BGiSpRcyyWiwlesjTWooXl
    NEXT_ANTHROPIC_AI_KEY: sk-test
    VAPID_PRIVATE_KEY: vapid-test

jobs:
    e2e:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.24.0

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Playwright browsers
              run: pnpm exec playwright install --with-deps chromium

            - name: Build
              run: pnpm build

            - name: Run E2E tests
              run: pnpm e2e
