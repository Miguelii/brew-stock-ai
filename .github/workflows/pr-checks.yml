name: PR Checks

on:
    pull_request:

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    # Lint and dead-code checks — no build needed, runs fast
    lint:
        name: Lint & Knip
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.24.0

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm lint

            - name: Knip
              run: pnpm knip

    # TypeScript type-checking — no build needed, no env vars needed
    typecheck:
        name: Typecheck
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.24.0

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm build

            - name: Typecheck
              run: pnpm typecheck

    # Unit tests — no build needed
    unit:
        name: Unit Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.24.0

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Unit tests
              run: pnpm test

    # Production build — validates the app compiles cleanly
    build:
        name: Build
        runs-on: ubuntu-latest
        env:
            NEXT_SUPABASE_URL: http://localhost:54321
            NEXT_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
            NEXT_SUPABASE_SERVICE_ROLE_KEY: test-service-key
            NEXT_FINNHUB_BASE_URL: http://localhost:54321/api/v1
            NEXT_FINNHUB_API_KEY: test-key
            NEXT_PUBLIC_VAPID_PUBLIC_KEY: BGiSpRcyyWiwlesjTWooXl
            NEXT_ANTHROPIC_AI_KEY: sk-test
            VAPID_PRIVATE_KEY: vapid-test
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.24.0

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm build
