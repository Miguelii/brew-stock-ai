name: PR Checks

on:
    pull_request:
        branches:
            - main
        types: [opened, synchronize, reopened, ready_for_review]

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    NEXT_SUPABASE_URL: http://localhost:54321
    NEXT_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    NEXT_SUPABASE_SERVICE_ROLE_KEY: test-service-key
    NEXT_FINNHUB_BASE_URL: http://localhost:54321/api/v1
    NEXT_FINNHUB_API_KEY: test-key
    NEXT_PUBLIC_VAPID_PUBLIC_KEY: BGiSpRcyyWiwlesjTWooXl
    NEXT_ANTHROPIC_AI_KEY: sk-test
    VAPID_PRIVATE_KEY: vapid-test

jobs:
    lint:
        name: Lint & Knip
        if: github.event.pull_request.draft == false
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup
            - run: pnpm lint
            - run: pnpm knip

    typecheck:
        name: Typecheck
        if: github.event.pull_request.draft == false
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup
            - run: pnpm build
            - run: pnpm typecheck

    unit:
        name: Unit Tests
        if: github.event.pull_request.draft == false
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup
            - run: pnpm test

    build:
        name: Build
        if: github.event.pull_request.draft == false
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup
            - run: pnpm build
